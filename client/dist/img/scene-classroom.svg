<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Enseignant devant un tableau, élèves en classe">
  <style>
    @keyframes blink { 0%,90%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes write { 0%,100% { transform: translate(0,0) } 25% { transform: translate(7px,3px) } 50% { transform: translate(15px,-2px) } 75% { transform: translate(23px,4px) } }
    @keyframes talk { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(.45) } }
    @keyframes sway { 0%,100% { transform: rotate(-1.2deg) } 50% { transform: rotate(1.2deg) } }
    @keyframes handUp { 0%,70%,100% { transform: rotate(0deg) } 80%,92% { transform: rotate(-16deg) } }
    @keyframes headTilt { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(3deg) } }
    @keyframes chalkFade { 0% { opacity:0 } 30% { opacity:.35 } 100% { opacity:1 } }
    @keyframes floatNote { 0% { transform: translateY(6px); opacity:0 } 30% { opacity:.5 } 100% { transform: translateY(-6px); opacity:0 } }
    @keyframes glowLine { 0%,100% { opacity:.5 } 50% { opacity:1 } }

    .e1 { transform-origin: 203px 284px; animation: blink 4.2s infinite }
    .e2 { transform-origin: 281px 284px; animation: blink 5.1s .6s infinite }
    .e3 { transform-origin: 359px 284px; animation: blink 4.7s 1.1s infinite }
    .h1 { transform-origin: 210px 286px; animation: headTilt 7s ease-in-out infinite }
    .h2 { transform-origin: 288px 286px; animation: headTilt 8s ease-in-out .8s infinite }
    .h3 { transform-origin: 366px 286px; animation: headTilt 6.4s ease-in-out .3s infinite }
    .s1 { animation: sway 4.6s ease-in-out infinite; transform-origin: 210px 346px }
    .s2 { animation: sway 5.3s ease-in-out .5s infinite; transform-origin: 288px 346px }
    .s3 { animation: sway 4.1s ease-in-out 1s infinite; transform-origin: 366px 346px }
    .arm-up { transform-origin: 196px 322px; animation: handUp 6s ease-in-out infinite }
    .chalk { animation: write 3.2s ease-in-out infinite }
    .mouth { transform-origin: 88px 184px; animation: talk 2.4s ease-in-out infinite }
    .pointer { transform-origin: 128px 228px; animation: write 3.2s ease-in-out infinite }
    .line { animation: chalkFade 3.2s ease-in-out infinite }
    .note { animation: floatNote 4s ease-in-out infinite }
    .n2 { animation-delay: 1.3s } .n3 { animation-delay: 2.6s }
    .glow { animation: glowLine 3.6s ease-in-out infinite }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/><stop offset="1" stop-color="#dbe3ec"/>
    </linearGradient>
  </defs>

  <rect width="480" height="400" fill="url(#bg3)"/>

  <!-- whiteboard -->
  <rect x="150" y="34" width="270" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line class="line" x1="170" y1="66" x2="300" y2="66"/>
    <line class="line" x1="170" y1="88" x2="260" y2="88" style="animation-delay:.35s"/>
  </g>
  <g fill="#0ea5e9" opacity="0.45">
    <rect class="line" x="320" y="60" width="80" height="10" rx="5"/>
    <rect class="line" x="320" y="80" width="60" height="10" rx="5" style="animation-delay:.5s"/>
  </g>
  <g stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path class="line" d="M180 150 l26 -22 l24 18 l34 -30"/>
  </g>
  <g fill="#10b981">
    <circle class="line" cx="206" cy="128" r="4"/>
    <circle class="line" cx="230" cy="146" r="4" style="animation-delay:.4s"/>
    <circle class="line glow" cx="264" cy="116" r="4"/>
  </g>
  <rect x="150" y="150" width="270" height="8" rx="4" fill="#cbd5e1"/>

  <!-- floating notes (life) -->
  <g opacity=".5">
    <circle class="note" cx="392" cy="214" r="3" fill="#6366f1"/>
    <circle class="note n2" cx="410" cy="228" r="2.4" fill="#0ea5e9"/>
    <circle class="note n3" cx="380" cy="232" r="2" fill="#f59e0b"/>
  </g>

  <!-- teacher -->
  <g>
    <path d="M74 210 q46 -12 62 26 l8 74 q-4 18 -22 18 h-44 q-20 0 -22 -20 z" fill="#4f46e5"/>
    <circle cx="88" cy="176" r="24" fill="#f0c9a4"/>
    <path d="M65 172 q4 -26 26 -24 q22 2 22 22 q-6 -12 -24 -11 q-18 1 -24 13 z" fill="#3f2d20"/>
    <ellipse class="e1" cx="80" cy="176" rx="2.2" ry="2.8" fill="#3f2d20"/>
    <ellipse class="e1" cx="96" cy="176" rx="2.2" ry="2.8" fill="#3f2d20"/>
    <ellipse class="mouth" cx="88" cy="187" rx="4" ry="2.4" fill="#c98d63"/>
    <path class="pointer" d="M74 240 q28 -12 46 -6" stroke="#4f46e5" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="126" cy="232" r="9" fill="#f0c9a4"/>
    <rect x="58" y="322" width="18" height="52" rx="8" fill="#1e293b"/>
    <rect x="104" y="322" width="18" height="52" rx="8" fill="#1e293b"/>
  </g>

  <!-- chalk moving on the board -->
  <g class="chalk">
    <rect x="196" y="126" width="10" height="6" rx="2" fill="#f8fafc" transform="rotate(-20 201 129)"/>
  </g>

  <!-- students -->
  <g class="s1">
    <g class="h1">
      <circle cx="210" cy="286" r="17" fill="#d9a066"/>
      <path d="M194 284 q3 -20 18 -19 q16 1 17 18 q-6 -9 -19 -9 q-12 0 -16 10 z" fill="#292524"/>
      <ellipse class="e1" cx="204" cy="286" rx="1.9" ry="2.4" fill="#292524"/>
      <ellipse class="e1" cx="216" cy="286" rx="1.9" ry="2.4" fill="#292524"/>
      <path d="M205 293 q5 3 10 0" stroke="#8d5524" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    </g>
    <path d="M190 312 q20 -8 40 0 l4 34 h-48 z" fill="#0ea5e9"/>
    <g class="arm-up">
      <path d="M198 320 q-14 -10 -16 -24" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="181" cy="294" r="6" fill="#d9a066"/>
    </g>
  </g>

  <g class="s2">
    <g class="h2">
      <circle cx="288" cy="286" r="17" fill="#8d5524"/>
      <path d="M272 284 q3 -20 18 -19 q16 1 17 18 q-6 -9 -19 -9 q-12 0 -16 10 z" fill="#1c1917"/>
      <ellipse class="e2" cx="282" cy="286" rx="1.9" ry="2.4" fill="#1c1917"/>
      <ellipse class="e2" cx="294" cy="286" rx="1.9" ry="2.4" fill="#1c1917"/>
    </g>
    <path d="M268 312 q20 -8 40 0 l4 34 h-48 z" fill="#10b981"/>
  </g>

  <g class="s3">
    <g class="h3">
      <circle cx="366" cy="286" r="17" fill="#f0c9a4"/>
      <path d="M350 284 q3 -20 18 -19 q16 1 17 18 q-6 -9 -19 -9 q-12 0 -16 10 z" fill="#78350f"/>
      <ellipse class="e3" cx="360" cy="286" rx="1.9" ry="2.4" fill="#78350f"/>
      <ellipse class="e3" cx="372" cy="286" rx="1.9" ry="2.4" fill="#78350f"/>
    </g>
    <path d="M346 312 q20 -8 40 0 l4 34 h-48 z" fill="#f59e0b"/>
  </g>

  <!-- front desks -->
  <g>
    <rect x="180" y="330" width="220" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="180" y="340" width="220" height="26" rx="5" fill="#e2e8f0"/>
    <rect class="line" x="196" y="348" width="70" height="6" rx="3" fill="#cbd5e1" style="animation-delay:.2s"/>
    <rect class="line" x="196" y="358" width="48" height="6" rx="3" fill="#cbd5e1" style="animation-delay:.6s"/>
  </g>
</svg>

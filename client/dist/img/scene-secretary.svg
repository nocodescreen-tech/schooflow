<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Secrétaire d'établissement enregistrant un paiement">
  <style>
    @keyframes blink { 0%,90%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes tap { 0%,100% { transform: translateY(0) } 50% { transform: translateY(2.5px) } }
    @keyframes headTilt { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(2.5deg) } }
    @keyframes coinDrop { 0% { transform: translateY(-70px); opacity:0 } 20% { opacity:1 } 100% { transform: translateY(0); opacity:1 } }
    @keyframes stackPulse { 0%,100% { transform: scaleY(1) } 50% { transform: scaleY(1.04) } }
    @keyframes receiptOut { 0%,100% { transform: translateY(0) rotate(-6deg) } 50% { transform: translateY(-3px) rotate(-6deg) } }
    @keyframes scanLine { 0% { transform: translateX(0) } 50% { transform: translateX(60px) } 100% { transform: translateX(0) } }
    @keyframes glowSoft { 0%,100% { opacity:.14 } 50% { opacity:.26 } }
    @keyframes floatUp { 0% { transform: translateY(10px); opacity:0 } 35% { opacity:.55 } 100% { transform: translateY(-10px); opacity:0 } }
    @keyframes sway { 0%,100% { transform: rotate(-1deg) } 50% { transform: rotate(1deg) } }

    .eyeL { transform-origin: 242px 150px; animation: blink 4.4s infinite }
    .eyeR { transform-origin: 258px 150px; animation: blink 4.4s .05s infinite }
    .head  { transform-origin: 250px 162px; animation: headTilt 7.5s ease-in-out infinite }
    .body  { animation: breatheY 4.2s ease-in-out infinite; transform-origin: 250px 210px }
    @keyframes breatheY { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-1.5px) } }
    .hand  { animation: tap .7s ease-in-out infinite }
    .armP  { transform-origin: 236px 250px; animation: tap 1.4s ease-in-out infinite }
    .coin  { animation: coinDrop 2.6s cubic-bezier(.3,.7,.4,1) infinite }
    .coin2 { animation-delay: .9s } .coin3 { animation-delay: 1.7s }
    .stack { animation: stackPulse 2.6s ease-in-out infinite }
    .rec   { animation: receiptOut 5s ease-in-out infinite }
    .scan  { animation: scanLine 3.4s ease-in-out infinite }
    .glow  { animation: glowSoft 5s ease-in-out infinite }
    .f1 { animation: floatUp 4s ease-in-out infinite }
    .f2 { animation: floatUp 4s ease-in-out 1.2s infinite }
    .f3 { animation: floatUp 4s ease-in-out 2.4s infinite }
    .bord { animation: sway 6s ease-in-out infinite; transform-origin: 115px 84px }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="400" fill="url(#bg2)"/>
  <circle cx="392" cy="96" r="86" fill="#0ea5e9" class="glow"/>

  <!-- window -->
  <rect x="330" y="30" width="120" height="120" rx="8" fill="#cbd5e1"/>
  <line x1="390" y1="30" x2="390" y2="150" stroke="#94a3b8" stroke-width="3"/>
  <line x1="330" y1="90" x2="450" y2="90" stroke="#94a3b8" stroke-width="3"/>

  <!-- pinboard -->
  <g class="bord">
    <rect x="40" y="34" width="150" height="100" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="2"/>
    <g fill="#6366f1" opacity="0.38">
      <rect x="54" y="48" width="40" height="28" rx="3"/>
      <rect x="102" y="48" width="34" height="28" rx="3"/>
      <rect x="144" y="48" width="32" height="28" rx="3"/>
      <rect x="54" y="86" width="60" height="28" rx="3"/>
      <rect x="122" y="86" width="54" height="28" rx="3"/>
    </g>
  </g>

  <!-- floating life indicators -->
  <g>
    <circle class="f1" cx="308" cy="188" r="3.5" fill="#10b981"/>
    <circle class="f2" cx="330" cy="206" r="2.8" fill="#6366f1"/>
    <circle class="f3" cx="292" cy="212" r="2.2" fill="#f59e0b"/>
  </g>

  <!-- desk -->
  <rect x="30" y="286" width="420" height="14" rx="7" fill="#94a3b8"/>
  <rect x="56" y="300" width="12" height="80" rx="6" fill="#64748b"/>
  <rect x="412" y="300" width="12" height="80" rx="6" fill="#64748b"/>

  <!-- laptop with scan line -->
  <path d="M150 210 h130 l16 76 h-162 z" fill="#475569"/>
  <rect x="164" y="202" width="60" height="8" rx="3" fill="#0ea5e9" opacity="0.7"/>
  <rect class="scan" x="228" y="218" width="40" height="3" rx="1.5" fill="#94a3b8" opacity="0.8"/>

  <!-- cash stack -->
  <g class="stack">
    <rect x="300" y="272" width="74" height="14" rx="3" fill="#10b981"/>
    <rect x="304" y="258" width="74" height="14" rx="3" fill="#059669"/>
    <rect x="300" y="244" width="74" height="14" rx="3" fill="#10b981"/>
    <circle cx="336" cy="251" r="4" fill="#ecfdf5" opacity="0.8"/>
  </g>
  <g>
    <circle class="coin"  cx="316" cy="182" r="6" fill="#f59e0b"/>
    <circle class="coin coin2" cx="336" cy="182" r="6" fill="#fbbf24"/>
    <circle class="coin coin3" cx="356" cy="182" r="6" fill="#f59e0b"/>
  </g>

  <!-- receipt -->
  <g class="rec">
    <rect x="118" y="262" width="58" height="26" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-6 147 275)"/>
    <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round" transform="rotate(-6 147 275)">
      <line x1="126" y1="270" x2="166" y2="270"/>
      <line x1="126" y1="277" x2="156" y2="277"/>
    </g>
  </g>

  <!-- person -->
  <g>
    <g class="body">
      <path d="M236 190 q56 -12 76 30 l10 68 q-4 20 -28 20 h-56 q-22 0 -24 -22 z" fill="#0d9488"/>
      <path d="M236 190 q56 -12 76 30 l5 24 q-28 -18 -84 -10 z" fill="#0f766e"/>
    </g>

    <g class="head">
      <circle cx="250" cy="152" r="27" fill="#8d5524"/>
      <path d="M224 148 q4 -30 30 -28 q26 2 26 26 q-8 -14 -30 -12 q-20 2 -26 14 z" fill="#1c1917"/>
      <circle cx="250" cy="126" r="13" fill="#1c1917"/>
      <path d="M228 124 q12 -14 26 -2" stroke="#1c1917" stroke-width="6" stroke-linecap="round" fill="none"/>
      <ellipse class="eyeL" cx="242" cy="152" rx="2.3" ry="2.9" fill="#1c1917"/>
      <ellipse class="eyeR" cx="258" cy="152" rx="2.3" ry="2.9" fill="#1c1917"/>
      <path d="M243 165 q7 5 14 0" stroke="#6b4423" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>

    <path class="armP" d="M236 250 q-34 26 -46 34" stroke="#0f766e" stroke-width="17" stroke-linecap="round" fill="none"/>
    <circle class="hand" cx="176" cy="286" r="10" fill="#8d5524"/>
  </g>
</svg>

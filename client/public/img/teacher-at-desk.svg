<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-label="Enseignante utilisant SCHOOLFLOW devant son ordinateur">
  <style>
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes typeLeft { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
    @keyframes typeRight { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
    @keyframes breathe { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-2px) } }
    @keyframes headTurn { 0%,100% { transform: rotate(0deg) } 45% { transform: rotate(2.5deg) } }
    @keyframes growBar { from { transform: scaleY(0) } to { transform: scaleY(1) } }
    @keyframes pulseDot { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes glow { 0%,100% { opacity:.18 } 50% { opacity:.34 } }
    @keyframes slidePaper { 0%,100% { transform: translateX(0) } 50% { transform: translateX(3px) } }
    @keyframes scrollHint { 0% { transform: translateY(0); opacity:0 } 40% { opacity:1 } 100% { transform: translateY(5px); opacity:0 } }

    .eye-l { transform-origin: 344px 258px; animation: blink 5.5s infinite; }
    .eye-r { transform-origin: 360px 258px; animation: blink 5.5s infinite; }
    .head   { transform-origin: 352px 268px; animation: headTurn 9s ease-in-out infinite; }
    .torso  { animation: breathe 4s ease-in-out infinite; }
    .hand-l { animation: typeLeft .55s ease-in-out infinite; }
    .hand-r { animation: typeRight .55s ease-in-out infinite; }
    .arm    { transform-origin: 330px 336px; animation: typeRight 1.1s ease-in-out infinite; }
    .bar    { transform-origin: center bottom; animation: growBar 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
    .b1 { animation-delay: .05s } .b2 { animation-delay: .18s } .b3 { animation-delay: .3s }
    .b4 { animation-delay: .12s } .b5 { animation-delay: .26s } .b6 { animation-delay: .4s }
    .dot    { animation: pulseDot 2.4s ease-in-out infinite; }
    .glow   { animation: glow 5s ease-in-out infinite; }
    .paper  { animation: slidePaper 6s ease-in-out infinite; }
    .cursor { animation: scrollHint 2s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="520" height="640" fill="url(#sky)"/>
  <circle cx="430" cy="90" r="120" fill="#6366f1" class="glow"/>
  <circle cx="70" cy="180" r="90" fill="#0ea5e9" opacity="0.1"/>

  <!-- window blinds -->
  <g opacity="0.14" fill="#94a3b8">
    <rect x="300" y="40" width="180" height="10" rx="5"/>
    <rect x="300" y="66" width="180" height="10" rx="5"/>
    <rect x="300" y="92" width="180" height="10" rx="5"/>
  </g>

  <!-- desk -->
  <rect x="40" y="470" width="440" height="16" rx="8" fill="url(#desk)"/>
  <rect x="70" y="486" width="14" height="120" rx="7" fill="#1e293b"/>
  <rect x="436" y="486" width="14" height="120" rx="7" fill="#1e293b"/>

  <!-- monitor -->
  <rect x="120" y="250" width="270" height="176" rx="12" fill="#0f172a"/>
  <rect x="130" y="260" width="250" height="156" rx="6" fill="url(#screen)"/>

  <!-- live dashboard -->
  <g>
    <rect x="130" y="260" width="250" height="20" fill="#eef2f7"/>
    <circle cx="142" cy="270" r="4" fill="#6366f1" class="dot"/>
    <rect x="152" y="266" width="52" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="338" y="264" width="32" height="12" rx="6" fill="#6366f1" opacity="0.3"/>

    <rect x="140" y="290" width="54" height="34" rx="6" fill="#6366f1" opacity="0.14"/>
    <rect x="148" y="298" width="30" height="8" rx="4" fill="#6366f1"/>
    <rect x="202" y="290" width="54" height="34" rx="6" fill="#0ea5e9" opacity="0.14"/>
    <rect x="210" y="298" width="30" height="8" rx="4" fill="#0ea5e9"/>
    <rect x="264" y="290" width="54" height="34" rx="6" fill="#f59e0b" opacity="0.16"/>
    <rect x="272" y="298" width="30" height="8" rx="4" fill="#f59e0b"/>
    <rect x="326" y="290" width="46" height="34" rx="6" fill="#10b981" opacity="0.14"/>
    <rect x="334" y="298" width="26" height="8" rx="4" fill="#10b981"/>

    <!-- animated bars -->
    <rect x="140" y="336" width="118" height="70" rx="6" fill="#f1f5f9"/>
    <g fill="#6366f1">
      <rect class="bar b1" x="150" y="386" width="10" height="14" rx="2" opacity="0.45"/>
      <rect class="bar b2" x="166" y="378" width="10" height="22" rx="2" opacity="0.6"/>
      <rect class="bar b3" x="182" y="368" width="10" height="32" rx="2" opacity="0.75"/>
      <rect class="bar b4" x="198" y="360" width="10" height="40" rx="2"/>
      <rect class="bar b5" x="214" y="370" width="10" height="30" rx="2" opacity="0.8"/>
      <rect class="bar b6" x="230" y="382" width="10" height="18" rx="2" opacity="0.55"/>
    </g>

    <!-- animated list rows -->
    <rect x="266" y="336" width="106" height="70" rx="6" fill="#f1f5f9"/>
    <g>
      <rect x="276" y="348" width="86" height="7" rx="3" fill="#e2e8f0"/>
      <rect x="276" y="362" width="70" height="7" rx="3" fill="#e2e8f0"/>
      <rect x="276" y="376" width="80" height="7" rx="3" fill="#e2e8f0"/>
      <rect x="276" y="390" width="58" height="7" rx="3" fill="#e2e8f0"/>
      <rect class="cursor" x="276" y="348" width="2" height="7" fill="#6366f1"/>
    </g>
  </g>

  <!-- stand + keyboard -->
  <rect x="236" y="426" width="38" height="26" fill="#1e293b"/>
  <rect x="206" y="450" width="98" height="12" rx="6" fill="#334155"/>
  <rect x="150" y="442" width="200" height="20" rx="5" fill="#475569"/>
  <g fill="#64748b" opacity="0.7">
    <rect x="158" y="447" width="184" height="3" rx="1.5"/>
    <rect x="158" y="453" width="184" height="3" rx="1.5"/>
  </g>

  <!-- person -->
  <g>
    <rect x="360" y="300" width="16" height="170" rx="8" fill="#1e293b"/>
    <rect x="330" y="300" width="60" height="14" rx="7" fill="#1e293b"/>

    <g class="torso">
      <path d="M330 300 q70 -14 96 34 l14 66 q-6 24 -34 24 h-70 q-26 0 -28 -26 z" fill="#6366f1"/>
      <path d="M330 300 q70 -14 96 34 l6 28 q-34 -20 -104 -12 z" fill="#4f46e5"/>
    </g>

    <g class="head">
      <circle cx="352" cy="262" r="30" fill="#e8b98a"/>
      <path d="M322 258 q4 -34 34 -32 q30 2 30 30 q-10 -16 -34 -14 q-22 2 -30 16 z" fill="#1f2937"/>
      <circle cx="352" cy="234" r="15" fill="#1f2937"/>
      <path d="M340 232 q12 -14 26 -2" stroke="#1f2937" stroke-width="6" stroke-linecap="round" fill="none"/>
      <ellipse class="eye-l" cx="344" cy="258" rx="2.4" ry="3" fill="#1f2937"/>
      <ellipse class="eye-r" cx="360" cy="258" rx="2.4" ry="3" fill="#1f2937"/>
      <path d="M345 271 q7 5 14 0" stroke="#c98d63" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <path class="arm" d="M330 336 q-42 34 -60 92" stroke="#4f46e5" stroke-width="19" stroke-linecap="round" fill="none"/>
    <circle class="hand-l" cx="268" cy="432" r="12" fill="#e8b98a"/>
  </g>

  <!-- papers on desk -->
  <g class="paper">
    <rect x="300" y="440" width="72" height="30" rx="4" fill="#e2e8f0" transform="rotate(-8 336 455)"/>
    <rect x="306" y="446" width="44" height="4" rx="2" fill="#94a3b8" transform="rotate(-8 336 455)"/>
    <rect x="306" y="454" width="34" height="4" rx="2" fill="#94a3b8" transform="rotate(-8 336 455)"/>
  </g>
</svg>

{% extends "base.html" %}
{% block title %}Ping Utility - SchoolFlow{% endblock %}
{% block content %}
<h2>Network Ping Tool</h2>
<form method="POST" action="{{ url_for('ping') }}">
    <div class="form-group">
        <label for="host">Hostname or IP address:</label>
        <input type="text" id="host" name="host" value="127.0.0.1" required>
    </div>
    <button type="submit">Ping</button>
</form>
{% if output %}
    <h3>Ping Results:</h3>
    <pre>{{ output }}</pre>
{% endif %}
{% endblock %}
